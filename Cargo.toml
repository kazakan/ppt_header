[package]
name = "ppt_header"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo = "0.11"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
rust_xlsxwriter = { version = "0.68", features = ["wasm"] }
# web-sys features needed for file handling and console logging
web-sys = { version = "0.3", features = [
    "File",
    "FileReader",
    "FileList",
    "HtmlInputElement",
    "Blob",
    "Url",
    "Window",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "EventTarget",
    "Event",
    "console",
] }
chrono = { version = "0.4.43", features = ["wasmbind"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
